version: '3.8'

services:
  # ============================================================================
  # 1. SERVICIO DE AUDITORÍA Y REGISTRO (LOGS)
  # ============================================================================
  db_logs:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: logs_db
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d logs_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  logs_service:
    build: ./services/logs_service
    restart: unless-stopped
    ports:
      - "${LOGS_PORT:-5000}:5000"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@db_logs:5432/logs_db
      - DB_LOGS_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@db_logs:5432/logs_db
    depends_on:
      db_logs:
        condition: service_healthy

  # ============================================================================
  # 2. SERVICIO DE AUTENTICACIÓN (AUTH)
  # ============================================================================
  db_auth:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d auth_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  auth_service:
    build: ./services/auth_service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-5001}:5001"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@db_auth:5432/auth_db
      - LOGS_URL=${LOGS_URL:-http://logs_service:5000/logs}
      - JWT_SECRET=${JWT_SECRET:-secreto_del_pinguino_aislado}
      - TOKEN_AUTH=${TOKEN_AUTH:-TOKEN-AUTH-002}
    depends_on:
      db_auth:
        condition: service_healthy
      logs_service:
        condition: service_started

  # ============================================================================
  # 3. SERVICIO DE GESTIÓN FINANCIERA DE CUENTAS (ACCOUNT)
  # ============================================================================
  db_operador:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: operador_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d operador_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  account_service:
    build: ./services/account_service
    restart: unless-stopped
    ports:
      - "${ACCOUNT_PORT:-5002}:5002"
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@db_operador:5432/operador_db
      - DB_ACCOUNT_URL=postgresql://${DB_USER:-admin}:${DB_PASSWORD:-password}@db_operador:5432/operador_db
      - LOGS_URL=${LOGS_URL:-http://logs_service:5000/logs}
      - JWT_SECRET=${JWT_SECRET:-secreto_del_pinguino_aislado}
      - TOKEN_ACCOUNT=${TOKEN_ACCOUNT:-TOKEN-PAYMENTS-003}
      - TOKEN_LOGS_ACCOUNT=${TOKEN_ACCOUNT:-TOKEN-PAYMENTS-003}
    depends_on:
      db_operador:
        condition: service_healthy
      logs_service:
        condition: service_started